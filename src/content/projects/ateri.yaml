playStore: true
link: null
type:
  pt: Web · Mobile · API
  en: Web · Mobile · API
  es: Web · Móvil · API
tagline:
  pt: Gestão de visitas técnicas rurais, offline-first
  en: Offline-first management of rural technical visits
  es: Gestión de visitas técnicas rurales, offline-first
description:
  pt: >-
    Plataforma para técnicos que acompanham agroindústrias familiares em campo. Cadastro de produtores,
    visitas com histórico rastreável, fotos e documentos. Funciona sem sinal e sincroniza depois, resolvendo
    conflitos campo a campo.
  en: >-
    A platform for field technicians who support family agro-industries. Producer records, visits with a
    traceable history, photos and documents. Works with no signal and syncs later, resolving conflicts field
    by field.
  es: >-
    Plataforma para técnicos que acompañan agroindustrias familiares en campo. Registro de productores,
    visitas con historial rastreable, fotos y documentos. Funciona sin señal y sincroniza después, resolviendo
    conflictos campo a campo.
