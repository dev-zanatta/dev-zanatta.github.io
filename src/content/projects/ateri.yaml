  - React
  - React Native
  - C#
  - .NET 10
  - PostgreSQL
  - Docker
year: '2026'
status:
  pt: Em uso no campo
  en: In field use
  es: En uso en el campo
role:
  pt: Full stack — API, web e app
  en: Full stack — API, web and app
  es: Full stack — API, web y app
summary:
  - pt: >-
      O Ateri organiza o trabalho de técnicos de extensão rural que acompanham agroindústrias familiares no
      oeste do Paraná. Cada produtor tem sua ficha, cada visita tem histórico rastreável, e o painel mostra a
      cota do mês — uma visita por produtor —, o que está atrasado e o que vem nos próximos dias.
    en: >-
      Ateri organizes the work of rural extension technicians who support family agro-industries in western
      Paraná. Every producer has a record, every visit has a traceable history, and the dashboard shows the
      monthly quota — one visit per producer —, what is overdue and what is coming up next.
    es: >-
      Ateri organiza el trabajo de técnicos de extensión rural que acompañan agroindustrias familiares en el
      oeste de Paraná. Cada productor tiene su ficha, cada visita tiene historial rastreable y el panel
      muestra la cuota del mes — una visita por productor —, lo atrasado y lo que viene en los próximos días.
  - pt: >-
      O app de campo é offline-first: grava tudo no aparelho, funciona sem sinal na propriedade e sincroniza
      quando a conexão volta, resolvendo conflitos campo a campo. A API em C# e .NET 10 é o contrato comum
      para o app em React Native e o painel web em React, e o projeto foi também uma forma de estudar a stack
      que o mercado pede.
    en: >-
      The field app is offline-first: it stores everything on the device, works with no signal on the farm and
      syncs when the connection returns, resolving conflicts field by field. The C# and .NET 10 API is the
      shared contract for the React Native app and the React web panel, and the project was also a way to
      study the stack the market asks for.
    es: >-
      La app de campo es offline-first: guarda todo en el dispositivo, funciona sin señal en la propiedad y
      sincroniza cuando vuelve la conexión, resolviendo conflictos campo a campo. La API en C# y .NET 10 es el
      contrato común de la app en React Native y del panel web en React, y el proyecto también fue una forma
      de estudiar la stack que pide el mercado.
problem:
  pt: >-
    Visitas técnicas acontecem em estradas de chão e propriedades sem sinal. As informações ficavam espalhadas
    entre cadernos, fotos no celular e planilhas, sem como saber quem já foi visitado no mês, quem está
    atrasado ou o que foi combinado na última visita.
  en: >-
    Technical visits happen on dirt roads and farms with no signal. Information was scattered across
    notebooks, phone photos and spreadsheets, with no way to know who had been visited that month, who was
    overdue or what was agreed on the last visit.
  es: >-
    Las visitas técnicas ocurren en caminos de tierra y propiedades sin señal. La información estaba repartida
    entre cuadernos, fotos del celular y planillas, sin forma de saber quién ya fue visitado en el mes, quién
    está atrasado o qué se acordó en la última visita.
audience:
  pt: Técnicos de ATER, gestores de equipe e instituições como o IDR-Paraná, cooperativas e sindicatos rurais.
  en: >-
    Rural extension technicians, team managers and institutions such as IDR-Paraná, cooperatives and rural
    unions.
  es: >-
    Técnicos de extensión rural, gestores de equipo e instituciones como el IDR-Paraná, cooperativas y
    sindicatos rurales.
features:
  - title:
      pt: Painel da cota do mês
      en: Monthly quota dashboard
      es: Panel de la cuota del mes
    text:
      pt: >-
        Quantos produtores já foram atendidos, visitas concluídas, atrasadas e da próxima semana, quem falta
        visitar e o andamento por bloco de rota.
      en: >-
        How many producers have been served, completed, overdue and next-week visits, who still needs a visit
        and progress per route block.
      es: >-
        Cuántos productores ya fueron atendidos, visitas concluidas, atrasadas y de la próxima semana, quién
        falta visitar y el avance por bloque de ruta.
  - title:
      pt: Agenda de visitas
      en: Visit schedule
      es: Agenda de visitas
    text:
      pt: >-
        Visitas por dia com status pendente, concluída, remarcada, cancelada ou atrasada, filtro por bloco,
        cidade e "só as minhas".
      en: >-
        Visits by day with pending, completed, rescheduled, canceled or overdue status, and filters by block,
        city and "only mine".
      es: >-
        Visitas por día con estado pendiente, concluida, reprogramada, cancelada o atrasada, y filtro por
        bloque, ciudad y "solo las mías".
  - title:
      pt: Ficha do produtor
      en: Producer record
      es: Ficha del productor
    text:
      pt: >-
        Dados, coordenadas, CAF com aviso de vencimento, equipe responsável, anotações fixadas e o histórico
        completo de visitas.
      en: >-
        Details, coordinates, CAF with expiry warning, responsible team, pinned notes and the full visit
        history.
      es: >-
        Datos, coordenadas, CAF con aviso de vencimiento, equipo responsable, notas fijadas y el historial
        completo de visitas.
  - title:
      pt: Blocos de rota
      en: Route blocks
      es: Bloques de ruta
    text:
      pt: Cidades agrupadas em blocos para planejar as saídas de campo e acompanhar a cobertura de cada região.
      en: Cities grouped into blocks to plan field trips and track coverage of each region.
      es: >-
        Ciudades agrupadas en bloques para planificar las salidas de campo y seguir la cobertura de cada
        región.
  - title:
      pt: Arquivos e lançamentos
      en: Files and expense entries
      es: Archivos y gastos
    text:
      pt: >-
        Fotos, documentos e áudios por produtor, que sobem só em Wi-Fi, além de quilometragem e despesas das
        visitas.
      en: Photos, documents and audio per producer, uploaded only on Wi-Fi, plus mileage and visit expenses.
      es: >-
        Fotos, documentos y audios por productor, que suben solo con Wi-Fi, además de kilometraje y gastos de
        las visitas.
  - title:
      pt: Funciona sem servidor
      en: Works without a server
      es: Funciona sin servidor
    text:
      pt: >-
        Um modo local permite usar o app na rua antes de existir servidor, guardando a fila de operações para
        levar tudo à API depois, sem perder nada.
      en: >-
        A local mode lets the app be used in the field before a server exists, keeping the operation queue to
        take everything to the API later, without losing anything.
      es: >-
        Un modo local permite usar la app en el campo antes de que exista servidor, guardando la cola de
        operaciones para llevar todo a la API después, sin perder nada.
