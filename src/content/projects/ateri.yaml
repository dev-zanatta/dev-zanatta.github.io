challenges:
  - title:
      pt: Uma rota de sincronização
      en: One sync route
      es: Una ruta de sincronización
    text:
      pt: >-
        O aparelho envia a fila de operações e recebe, na mesma resposta, o que mudou no servidor desde o
        último cursor. Com sinal fraco, cada ida e volta a menos conta, e o app já recebe o estado mesclado do
        que acabou de enviar.
      en: >-
        The device sends its operation queue and receives, in the same response, what changed on the server
        since the last cursor. With weak signal every round trip saved counts, and the app already gets the
        merged state of what it just sent.
      es: >-
        El dispositivo envía la cola de operaciones y recibe, en la misma respuesta, lo que cambió en el
        servidor desde el último cursor. Con señal débil cada ida y vuelta menos cuenta, y la app ya recibe el
        estado combinado de lo que acaba de enviar.
  - title:
      pt: Operações idempotentes com ids do aparelho
      en: Idempotent operations with device ids
      es: Operaciones idempotentes con ids del dispositivo
    text:
      pt: >-
        Cada operação tem um GUID v7 gerado no celular e a hora em que foi feita. Reenviar a mesma fila não
        duplica nada, e entidades criadas offline já nascem com o id definitivo.
      en: >-
        Every operation has a GUID v7 generated on the phone and the time it happened. Resending the same
        queue duplicates nothing, and entities created offline are born with their final id.
      es: >-
        Cada operación tiene un GUID v7 generado en el celular y la hora en que se hizo. Reenviar la misma
        cola no duplica nada, y las entidades creadas offline nacen con su id definitivo.
  - title:
      pt: Não perder trabalho em conflito
      en: Never losing work in a conflict
      es: No perder trabajo en un conflicto
    text:
      pt: >-
        A última escrita vence campo a campo, com histórico por registro. Se uma operação é recusada (um CPF
        repetido, por exemplo), as seguintes do mesmo produtor ficam adiadas em vez de descartadas, esperando
        a correção.
      en: >-
        Last write wins field by field, with a history per record. If an operation is rejected (a duplicate
        tax ID, for example), the following ones for the same producer are deferred instead of discarded,
        waiting for the fix.
      es: >-
        La última escritura gana campo a campo, con historial por registro. Si una operación es rechazada (un
        documento repetido, por ejemplo), las siguientes del mismo productor quedan diferidas en lugar de
        descartadas, esperando la corrección.
  - title:
      pt: Um contrato para dois clientes
      en: One contract for two clients
      es: Un contrato para dos clientes
    text:
      pt: >-
        O documento OpenAPI gerado pela API é a fonte dos tipos do web e do app. Web e mobile têm interfaces
        próprias, mas falam exatamente a mesma língua com o servidor.
      en: >-
        The OpenAPI document generated by the API is the source of types for web and app. Web and mobile have
        their own interfaces, but speak exactly the same language with the server.
      es: >-
        El documento OpenAPI generado por la API es la fuente de los tipos del web y de la app. Web y mobile
        tienen interfaces propias, pero hablan exactamente el mismo idioma con el servidor.
