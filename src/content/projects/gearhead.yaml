      es: >-
        Autos con marca, modelo, año, versión, color, potencia y lista de modificaciones, con un auto
        principal en el perfil.
  - title:
      pt: Feed da comunidade
      en: Community feed
      es: Feed de la comunidad
    text:
      pt: Posts com imagem, curtidas e comentários, no feed geral ou dentro de um clube.
      en: Posts with images, likes and comments, in the main feed or inside a club.
