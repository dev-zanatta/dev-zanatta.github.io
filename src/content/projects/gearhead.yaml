      en: JDM, Muscle, Euro, Off-Road, Classic and Track Day, with owner, admins, members and their own wall.
      es: >-
        JDM, Muscle, Euro, Off-Road, Classic y Track Day, con dueño, administradores, miembros y un muro
        propio.
  - title:
      pt: Encontros e eventos
      en: Meetups and events
      es: Encuentros y eventos
    text:
      pt: >-
        Encontros, track days e trilhas com data, local, limite de vagas e confirmação de presença, filtráveis
        por tipo e período.
      en: >-
        Meetups, track days and trails with date, place, attendee limit and RSVP, filterable by type and
        period.
      es: >-
        Encuentros, track days y travesías con fecha, lugar, cupo y confirmación de asistencia, filtrables por
        tipo y período.
  - title:
      pt: Amizades e mensagens
      en: Friends and messages
      es: Amistades y mensajes
    text:
      pt: Pedidos de amizade e conversas privadas entre membros.
      en: Friend requests and private conversations between members.
      es: Solicitudes de amistad y conversaciones privadas entre miembros.
  - title:
      pt: Três idiomas
      en: Three languages
      es: Tres idiomas
    text:
      pt: Interface em português, inglês e espanhol, com preferência de idioma e formato de hora por usuário.
      en: Interface in Portuguese, English and Spanish, with language and time-format preferences per user.
      es: Interfaz en portugués, inglés y español, con preferencia de idioma y formato de hora por usuario.
stackLayers:
  - layer: frontend
    items:
      - PHP puro
      - Roteador próprio
      - i18n pt/en/es
  - layer: backend
    items:
      - Laravel 12
      - JWT (tymon/jwt-auth)
  - layer: data
    items:
      - PostgreSQL
challenges:
  - title:
      pt: Desacoplar o front do banco
      en: Decoupling the front end from the database
      es: Desacoplar el front de la base
    text:
      pt: >-
        O front lia e gravava direto no PostgreSQL com PDO, em paralelo a uma API que ninguém consumia. A
        migração moveu cada leitura e escrita para endpoints da API e removeu por completo o acesso direto e o
        SQL legado.
      en: >-
        The front end read and wrote PostgreSQL directly with PDO, alongside an API nobody used. The migration
        moved every read and write to API endpoints and completely removed direct access and the legacy SQL.
      es: >-
        El front leía y escribía directamente en PostgreSQL con PDO, en paralelo a una API que nadie consumía.
        La migración movió cada lectura y escritura a endpoints de la API y eliminó por completo el acceso
        directo y el SQL heredado.
  - title:
      pt: Autenticação entre duas aplicações
      en: Authentication across two applications
      es: Autenticación entre dos aplicaciones
    text:
      pt: >-
        O token JWT é obtido no login e guardado na sessão PHP do front, que continua responsável por sessão,
        CSRF e mensagens. A API não conhece a sessão; o front não conhece o banco.
      en: >-
        The JWT is obtained at login and kept in the front end's PHP session, which still handles session,
        CSRF and flash messages. The API doesn't know the session; the front end doesn't know the database.
      es: >-
        El token JWT se obtiene en el login y se guarda en la sesión PHP del front, que sigue a cargo de
        sesión, CSRF y mensajes. La API no conoce la sesión; el front no conoce la base.
  - title:
      pt: Contadores coerentes
      en: Consistent counters
      es: Contadores coherentes
    text:
      pt: >-
        Membros de clube e confirmados em evento são exibidos em listas grandes, então ficam desnormalizados e
        precisam ser atualizados junto com cada entrada, saída e confirmação.
      en: >-
        Club members and event attendees are shown in long lists, so they're denormalized and must be updated
        together with every join, leave and RSVP.
      es: >-
        Miembros de clubes y confirmados en eventos se muestran en listas grandes, así que quedan
        desnormalizados y deben actualizarse junto con cada entrada, salida y confirmación.
