playStore: false
link: null
type:
  pt: Web · WebApp
  en: Web · WebApp
  es: Web · WebApp
tagline:
  pt: Rede social para quem respira automobilismo
  en: A social network for those who live and breathe cars
  es: Red social para quienes respiran automovilismo
description:
  pt: >-
    Comunidade online onde entusiastas de carros compartilham seus veículos, encontros, modificações e
    histórias. Feed, perfis, garage virtual e eventos por região.
  en: >-
    An online community where car enthusiasts share their vehicles, meetups, modifications and stories. Feed,
    profiles, virtual garage and events by region.
  es: >-
    Comunidad online donde los entusiastas de los coches comparten sus vehículos, encuentros, modificaciones e
    historias. Feed, perfiles, garaje virtual y eventos por región.
stack:
  - PHP/Laravel
  - PostgreSQL
year: '2026'
status:
  pt: Em desenvolvimento
  en: In development
  es: En desarrollo
role:
  pt: Full stack — API e front
  en: Full stack — API and front
  es: Full stack — API y front
summary:
  - pt: >-
      O GearHead é uma rede social para quem vive carro. Cada pessoa monta a sua garagem virtual com os
      carros, versões, potência e modificações, posta o andamento dos projetos, entra em clubes por estilo e
      confirma presença em encontros e track days da sua região.
    en: >-
      GearHead is a social network for people who live and breathe cars. Everyone builds a virtual garage with
      their cars, trims, horsepower and mods, posts project updates, joins clubs by style and RSVPs to meetups
      and track days in their region.
    es: >-
      GearHead es una red social para quienes viven los autos. Cada persona arma su garaje virtual con autos,
      versiones, potencia y modificaciones, publica el avance de sus proyectos, entra en clubes por estilo y
      confirma asistencia a encuentros y track days de su región.
  - pt: >-
      O projeto começou com duas aplicações paralelas que acessavam o mesmo banco. Ele foi reorganizado em um
      monorepo com responsabilidades claras: a API Laravel com JWT é a única que fala com o PostgreSQL, e o
      front em PHP puro, com roteador próprio e tradução em português, inglês e espanhol, consome tudo por
      HTTP.
    en: >-
      The project started as two parallel applications hitting the same database. It was reorganized into a
      monorepo with clear responsibilities: the Laravel API with JWT is the only thing that talks to
      PostgreSQL, and the plain PHP front end, with its own router and Portuguese, English and Spanish
      translations, consumes everything over HTTP.
    es: >-
      El proyecto empezó como dos aplicaciones paralelas que accedían a la misma base. Se reorganizó en un
      monorepo con responsabilidades claras: la API Laravel con JWT es la única que habla con PostgreSQL, y el
      front en PHP puro, con router propio y traducción en portugués, inglés y español, consume todo por HTTP.
problem:
  pt: >-
    Encontros, clubes e projetos de carro vivem espalhados entre grupos de WhatsApp e perfis genéricos de rede
    social, onde o carro é só mais uma foto e não há como achar quem tem o mesmo modelo ou o próximo encontro
    da cidade.
  en: >-
    Meetups, clubs and car projects are scattered across WhatsApp groups and generic social profiles, where a
    car is just another photo and there's no way to find people with the same model or the next meetup in
    town.
  es: >-
    Encuentros, clubes y proyectos de autos viven repartidos entre grupos de WhatsApp y perfiles genéricos de
    redes sociales, donde el auto es solo una foto más y no hay forma de encontrar a quien tiene el mismo
    modelo o el próximo encuentro de la ciudad.
audience:
  pt: Antigomobilistas, fãs de JDM, muscle cars, euro, off-road e quem participa de track days e encontros.
  en: Classic car collectors, JDM, muscle, euro and off-road fans, and people who go to track days and meetups.
  es: >-
    Coleccionistas de clásicos, fans de JDM, muscle cars, europeos, off-road y quienes van a track days y
    encuentros.
