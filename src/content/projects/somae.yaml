playStore: true
link: null
type:
  pt: Mobile
  en: Mobile
  es: Móvil
tagline:
  pt: Aplicativo para motoristas de aplicativo.
  en: An app for rideshare drivers.
  es: Aplicación para conductores de apps de transporte.
description:
  pt: >-
    Aplicativo para gestão de finanças pessoais focada para os motoristas de aplicativo. Histórico de ganhos,
    gastos, manutenções, insights.
  en: >-
    Personal finance management app focused on rideshare drivers. Earnings history, expenses, maintenance
    records and insights.
  es: >-
    App de gestión de finanzas personales enfocada en los conductores de apps de transporte. Historial de
    ganancias, gastos, mantenimientos e insights.
stack:
  - Vue 3
  - Quasar
  - Laravel
  - PostgreSQL
  - Capacitor
year: '2026'
status:
  pt: Teste fechado na Play Store
  en: Closed testing on the Play Store
  es: Prueba cerrada en la Play Store
role:
  pt: Full stack — API e app
  en: Full stack — API and app
  es: Full stack — API y app
summary:
  - pt: >-
      O Soma-Σ é o caderninho do motorista de aplicativo, só que fazendo as contas sozinho. O motorista liga a
      jornada no começo do dia, lança quanto fez em cada plataforma e o que gastou, e o app devolve o lucro
      líquido, quanto ganhou por hora e quanto custou cada quilômetro.
    en: >-
      Soma-Σ is the rideshare driver's notebook, except it does the math. The driver starts the shift in the
      morning, logs earnings per platform and expenses, and the app returns net profit, earnings per hour and
      cost per kilometer.
    es: >-
      Soma-Σ es la libreta del conductor de apps, solo que hace las cuentas sola. El conductor inicia la
      jornada al empezar el día, carga cuánto hizo en cada plataforma y lo que gastó, y la app devuelve la
      ganancia neta, cuánto ganó por hora y cuánto costó cada kilómetro.
  - pt: >-
      É dark e minimalista de propósito: é usado com o carro parado entre uma corrida e outra, com pouco tempo
      e muita luz na tela. Vue 3 e Quasar no app, Capacitor para o Android e uma API Laravel guardando o
      histórico.
    en: >-
      It is dark and minimal on purpose: it's used with the car parked between rides, with little time and
      lots of glare on the screen. Vue 3 and Quasar in the app, Capacitor for Android and a Laravel API
      keeping the history.
    es: >-
      Es oscura y minimalista a propósito: se usa con el auto detenido entre un viaje y otro, con poco tiempo
      y mucha luz en la pantalla. Vue 3 y Quasar en la app, Capacitor para Android y una API Laravel guardando
      el historial.
problem:
  pt: >-
    O motorista vê o valor bruto que a Uber e a 99 mostram, mas não o que sobra depois de energia,
    combustível, comida e manutenção. Sem esse número não dá para saber se vale rodar mais uma hora, se a
    semana bateu a meta ou se o carro está custando caro demais.
  en: >-
    Drivers see the gross amount Uber and 99 show, but not what is left after charging or fuel, food and
    maintenance. Without that number there's no way to know if another hour is worth it, if the week hit the
    goal or if the car is costing too much.
  es: >-
    El conductor ve el valor bruto que muestran Uber y 99, pero no lo que queda después de energía o
    combustible, comida y mantenimiento. Sin ese número no hay forma de saber si vale la pena una hora más, si
    la semana alcanzó la meta o si el auto está costando demasiado.
audience:
  pt: Motoristas de Uber, 99, InDrive, corridas particulares e turismo, com carro a combustão ou elétrico.
  en: Uber, 99, InDrive, private-ride and tour drivers, with combustion or electric cars.
  es: Conductores de Uber, 99, InDrive, viajes particulares y turismo, con auto a combustión o eléctrico.
features:
  - title:
      pt: Jornada com cronômetro
      en: Shift timer
      es: Jornada con cronómetro
    text:
      pt: >-
        Um toque inicia a jornada do dia, com pausa e retomada. O estado sobrevive ao fechamento do app e a um
        reinício do celular.
      en: >-
        One tap starts the day's shift, with pause and resume. The state survives closing the app and
        restarting the phone.
      es: >-
        Un toque inicia la jornada del día, con pausa y reanudación. El estado sobrevive al cierre de la app y
        a un reinicio del celular.
  - title:
      pt: Faturamento por plataforma
      en: Earnings per platform
      es: Facturación por plataforma
    text:
      pt: >-
        Uber, 99, InDrive, corridas particulares, turismo e outros, lançados no próprio dia. O saldo líquido e
        o progresso da meta diária se atualizam na hora.
      en: >-
        Uber, 99, InDrive, private rides, tours and others, logged on the day itself. Net balance and daily
        goal progress update instantly.
      es: >-
        Uber, 99, InDrive, viajes particulares, turismo y otros, cargados en el mismo día. El saldo neto y el
        progreso de la meta diaria se actualizan al instante.
  - title:
      pt: Despesas do dia
      en: Daily expenses
      es: Gastos del día
    text:
      pt: >-
        Energia, combustível, alimentação, pedágio, estacionamento, lavagem e manutenção, cada uma na sua
        categoria.
      en: Charging, fuel, food, tolls, parking, car wash and maintenance, each in its own category.
      es: >-
        Energía, combustible, comida, peaje, estacionamiento, lavado y mantenimiento, cada uno en su
        categoría.
  - title:
      pt: Insights do período
      en: Period insights
      es: Insights del período
    text:
      pt: >-
        Lucro líquido, R$ por hora, média por dia, horas trabalhadas, km rodados, eficiência em kWh/100 km ou
        km/L e a evolução semanal com a melhor semana destacada.
      en: >-
        Net profit, earnings per hour, average per day, hours worked, km driven, efficiency in kWh/100 km or
        km/l and weekly evolution with the best week highlighted.
      es: >-
        Ganancia neta, R$ por hora, promedio por día, horas trabajadas, km recorridos, eficiencia en kWh/100
        km o km/l y la evolución semanal con la mejor semana destacada.
  - title:
      pt: Calendário e histórico
      en: Calendar and history
      es: Calendario e historial
    text:
      pt: >-
        Os dias trabalhados aparecem no calendário da home, com intensidade pelo resultado, e o histórico
        agrupa por semana com bruto e líquido de cada dia.
      en: >-
        Worked days show on the home calendar, shaded by result, and the history groups by week with each
        day's gross and net.
      es: >-
        Los días trabajados aparecen en el calendario del inicio, con intensidad según el resultado, y el
        historial agrupa por semana con bruto y neto de cada día.
  - title:
      pt: Veículos e manutenções
      en: Vehicles and maintenance
      es: Vehículos y mantenimientos
    text:
      pt: >-
        Vários veículos, um ativo por vez, com eficiência própria e histórico de manutenções com custo e
        quilometragem.
      en: >-
        Several vehicles, one active at a time, each with its own efficiency and a maintenance history with
        cost and mileage.
      es: >-
        Varios vehículos, uno activo por vez, con eficiencia propia e historial de mantenimientos con costo y
        kilometraje.
  - title:
      pt: Metas semanais
      en: Weekly goals
      es: Metas semanales
    text:
      pt: Meta da semana e dias de trabalho por semana, com quanto falta por dia para alcançar o objetivo.
      en: Weekly goal and working days per week, with how much is still needed per day to reach it.
      es: Meta de la semana y días de trabajo por semana, con cuánto falta por día para alcanzar el objetivo.
