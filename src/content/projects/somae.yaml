challenges:
  - title:
      pt: Um timer que não se perde
      en: A timer that never gets lost
      es: Un cronómetro que no se pierde
    text:
      pt: >-
        A jornada é um turno aberto na API, mas a pausa é local e o estado fica no Capacitor Preferences. Ao
        abrir o app, o estado local é restaurado e depois reconciliado com o dashboard da API, sem duplicar
        horas.
      en: >-
        The shift is an open session in the API, but the pause is local and the state lives in Capacitor
        Preferences. When the app opens, the local state is restored and then reconciled with the API
        dashboard, without double-counting hours.
      es: >-
        La jornada es un turno abierto en la API, pero la pausa es local y el estado queda en Capacitor
        Preferences. Al abrir la app, el estado local se restaura y luego se concilia con el panel de la API,
        sin duplicar horas.
  - title:
      pt: Elétrico e combustão no mesmo cálculo
      en: Electric and combustion in the same math
      es: Eléctrico y combustión en el mismo cálculo
    text:
      pt: >-
        O tipo de energia vem da unidade de eficiência do veículo: km/kWh gera consumo em kWh/100 km a partir
        do preço da energia; km/L gera km por litro a partir do preço do combustível.
      en: >-
        The energy type comes from the vehicle's efficiency unit: km/kWh yields consumption in kWh/100 km from
        the energy price; km/l yields kilometers per liter from the fuel price.
      es: >-
        El tipo de energía sale de la unidad de eficiencia del vehículo: km/kWh genera consumo en kWh/100 km a
        partir del precio de la energía; km/l genera km por litro a partir del precio del combustible.
  - title:
      pt: Lançamento rápido e idempotente
      en: Fast, idempotent entry
      es: Carga rápida e idempotente
    text:
      pt: >-
        Existe um dia por motorista por data e um lançamento por plataforma por dia. Salvar um valor é um
        upsert, zerar apaga, e criar o dia de novo nunca devolve erro.
      en: >-
        There's one day per driver per date and one entry per platform per day. Saving a value is an upsert,
        zeroing it deletes it, and creating the day again never returns an error.
      es: >-
        Existe un día por conductor por fecha y una carga por plataforma por día. Guardar un valor es un
        upsert, ponerlo en cero lo borra, y crear el día de nuevo nunca devuelve error.
  - title:
      pt: Ler a corrida antes de aceitar
      en: Reading the ride before accepting it
      es: Leer el viaje antes de aceptarlo
    text:
      pt: >-
        Em paralelo, um protótipo Android nativo em Kotlin lê o card da corrida por captura de tela e OCR no
        aparelho e mostra R$/km e R$/hora, sem usar o serviço de acessibilidade, para não esbarrar nas
        políticas da Play Store.
      en: >-
        In parallel, a native Kotlin Android prototype reads the ride card through screen capture and
        on-device OCR and shows earnings per km and per hour, without using the accessibility service, to stay
        within Play Store policies.
      es: >-
        En paralelo, un prototipo Android nativo en Kotlin lee la tarjeta del viaje por captura de pantalla y
        OCR en el dispositivo y muestra R$/km y R$/hora, sin usar el servicio de accesibilidad, para no chocar
        con las políticas de la Play Store.
