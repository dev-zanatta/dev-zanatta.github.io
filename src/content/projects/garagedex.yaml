name: GarageDex
icon: /projects/garagedex.png
playStore: false
link: null
type:
  pt: Mobile · Jogo
  en: Mobile · Game
  es: Móvil · Juego
tagline:
  pt: O "Duolingo da mecânica" em pixel art
  en: The "Duolingo of auto repair", in pixel art
  es: El "Duolingo de la mecánica" en pixel art
description:
  pt: >-
    Jogo mobile que ensina o raciocínio de diagnóstico automotivo. O jogador toca uma oficina, interpreta
    sintomas, levanta hipóteses e descobre a causa do defeito em desafios diários baseados em casos reais.
  en: >-
    A mobile game that teaches automotive diagnostic reasoning. The player runs a repair shop, reads symptoms,
    forms hypotheses and finds the root cause in daily challenges based on real cases.
  es: >-
    Juego móvil que enseña el razonamiento del diagnóstico automotriz. El jugador dirige un taller, interpreta
    síntomas, plantea hipótesis y descubre la causa del defecto en desafíos diarios basados en casos reales.
stack:
  - Laravel
  - Quasar
  - Vue 3
  - Capacitor
  - PostgreSQL
year: '2026'
status:
  pt: Em desenvolvimento
  en: In development
  es: En desarrollo
role:
  pt: Game design, back e front
  en: Game design, back and front
  es: Game design, back y front
summary:
  - pt: >-
      O GarageDex ensina a pensar como um mecânico. O jogador é dono de uma oficina em pixel art e recebe
      carros reais com sintomas relatados pelo cliente. O objetivo não é desmontar peça por peça, mas
      diagnosticar: escolher o teste certo, achar a causa e só então reparar.
    en: >-
      GarageDex teaches you to think like a mechanic. The player owns a pixel-art repair shop and gets real
      cars with symptoms reported by the customer. The goal isn't to take everything apart, but to diagnose:
      pick the right test, find the cause and only then repair.
    es: >-
      GarageDex enseña a pensar como un mecánico. El jugador es dueño de un taller en pixel art y recibe autos
      reales con síntomas relatados por el cliente. El objetivo no es desarmar pieza por pieza, sino
      diagnosticar: elegir la prueba correcta, encontrar la causa y recién entonces reparar.
  - pt: >-
      Cada diagnóstico certo descobre um problema no GarageDex, a coleção de defeitos de cada modelo de carro.
      Energia que recarrega com o tempo, sequência de dias jogados, troféus, especializações por bancada e
      reparos que levam tempo de verdade criam o hábito diário de um app como o Duolingo.
    en: >-
      Every correct diagnosis unlocks a problem in the GarageDex, the collection of faults for each car model.
      Energy that recharges over time, daily streaks, trophies, per-workbench specializations and repairs that
      take real time build the daily habit of an app like Duolingo.
    es: >-
      Cada diagnóstico correcto descubre un problema en el GarageDex, la colección de fallas de cada modelo de
      auto. Energía que se recarga con el tiempo, racha de días jugados, trofeos, especializaciones por banco
      de trabajo y reparaciones que llevan tiempo real crean el hábito diario de una app como Duolingo.
problem:
  pt: >-
    Quem está começando na mecânica aprende trocando peça até o defeito sumir. O raciocínio de diagnóstico —
    sintoma, hipótese, teste, causa — é o que separa um bom mecânico, e quase nunca é ensinado de forma
    prática e repetível.
  en: >-
    People starting out in auto repair learn by swapping parts until the fault goes away. Diagnostic reasoning
    — symptom, hypothesis, test, cause — is what makes a good mechanic, and it's almost never taught in a
    practical, repeatable way.
  es: >-
    Quien empieza en la mecánica aprende cambiando piezas hasta que la falla desaparece. El razonamiento de
    diagnóstico — síntoma, hipótesis, prueba, causa — es lo que distingue a un buen mecánico, y casi nunca se
    enseña de forma práctica y repetible.
audience:
  pt: Estudantes de mecânica, entusiastas de carro e curiosos que querem entender por que o carro faz o que faz.
  en: Auto mechanics students, car enthusiasts and anyone curious about why a car does what it does.
  es: >-
    Estudiantes de mecánica, entusiastas de los autos y curiosos que quieren entender por qué el auto hace lo
    que hace.
features:
  - title:
      pt: Diagnóstico em vez de tentativa e erro
      en: Diagnosis instead of trial and error
      es: Diagnóstico en lugar de prueba y error
    text:
      pt: >-
        O cliente relata o sintoma e o jogador escolhe o próximo passo entre alternativas plausíveis. A
        precisão das escolhas pesa na recompensa.
      en: >-
        The customer reports the symptom and the player chooses the next step among plausible options.
        Accuracy weighs on the reward.
      es: >-
        El cliente relata el síntoma y el jugador elige el próximo paso entre alternativas plausibles. La
        precisión de las elecciones pesa en la recompensa.
  - title:
      pt: Carros e defeitos reais
      en: Real cars and faults
      es: Autos y fallas reales
    text:
      pt: >-
        Nove veículos de cinco fabricantes, nove motores, 66 problemas comuns e crônicos, 79 ações e 58
        ferramentas, com problemas ocultos que só aparecem para quem investiga.
      en: >-
        Nine vehicles from five makers, nine engines, 66 common and chronic problems, 79 actions and 58 tools,
        with hidden problems that only show up for those who investigate.
      es: >-
        Nueve vehículos de cinco fabricantes, nueve motores, 66 problemas comunes y crónicos, 79 acciones y 58
        herramientas, con problemas ocultos que solo aparecen para quien investiga.
  - title:
      pt: A coleção GarageDex
      en: The GarageDex collection
      es: La colección GarageDex
    text:
      pt: Cada veículo tem sua lista de problemas a descobrir, com progresso por modelo e por motor.
      en: Each vehicle has its own list of problems to discover, with progress per model and per engine.
      es: Cada vehículo tiene su lista de problemas por descubrir, con progreso por modelo y por motor.
  - title:
      pt: Oficina que cresce
      en: A shop that grows
      es: Un taller que crece
    text:
      pt: >-
        Bancadas por especialidade, ferramentas, elevadores e vagas compradas com o dinheiro dos atendimentos,
        liberando defeitos mais difíceis.
      en: >-
        Specialty workbenches, tools, lifts and parking spots bought with the money from each job, unlocking
        harder faults.
      es: >-
        Bancos por especialidad, herramientas, elevadores y lugares comprados con el dinero de los trabajos,
        liberando fallas más difíciles.
  - title:
      pt: Reparos com tempo
      en: Timed repairs
      es: Reparaciones con tiempo
    text:
      pt: >-
        O reparo roda de forma assíncrona e termina mesmo com o app fechado; ao voltar, o jogador recebe o que
        ficou pronto.
      en: >-
        Repairs run asynchronously and finish even with the app closed; when the player returns, finished work
        is waiting.
      es: >-
        La reparación corre de forma asíncrona y termina incluso con la app cerrada; al volver, el jugador
        recibe lo que quedó listo.
  - title:
      pt: Troféus, níveis e sequência diária
      en: Trophies, levels and daily streak
      es: Trofeos, niveles y racha diaria
    text:
      pt: >-
        30 troféus com níveis bronze, prata e ouro, XP por especialização, reputação e uma recompensa a cada
        novo dia jogado.
      en: >-
        30 trophies with bronze, silver and gold tiers, XP per specialization, reputation and a reward for
        every new day played.
      es: >-
        30 trofeos con niveles bronce, plata y oro, XP por especialización, reputación y una recompensa por
        cada nuevo día jugado.
stackLayers:
  - layer: frontend
    items:
      - Vue 3
      - Quasar 2
      - Pinia
      - vue-i18n
      - Pixel art
  - layer: backend
    items:
      - Laravel 13
      - PHP 8.4
      - Sanctum
      - Pest
  - layer: data
    items:
      - PostgreSQL 17
challenges:
  - title:
      pt: Um motor de diagnóstico justo
      en: A fair diagnostic engine
      es: Un motor de diagnóstico justo
    text:
      pt: >-
        As alternativas misturam as ações corretas dos problemas ainda não encontrados com distratores, e
        sempre há ao menos uma resposta certa. Quando não resta nada a descobrir, a pergunta some em vez de
        fazer o jogador gastar energia à toa.
      en: >-
        Options mix the correct actions for problems not yet found with distractors, and there's always at
        least one right answer. When nothing is left to discover, the question disappears instead of making
        the player burn energy for nothing.
      es: >-
        Las alternativas mezclan las acciones correctas de los problemas aún no encontrados con distractores,
        y siempre hay al menos una respuesta correcta. Cuando no queda nada por descubrir, la pregunta
        desaparece en vez de hacer gastar energía en vano.
  - title:
      pt: Regras de jogo no servidor
      en: Game rules on the server
      es: Reglas del juego en el servidor
    text:
      pt: >-
        Energia, recarga, dinheiro, XP e o fim dos reparos são calculados pela API, não pelo app. Isso impede
        trapaça e permite que o tempo passe com o jogo fechado.
      en: >-
        Energy, recharge, money, XP and repair completion are computed by the API, not the app. That prevents
        cheating and lets time pass with the game closed.
      es: >-
        Energía, recarga, dinero, XP y el fin de las reparaciones los calcula la API, no la app. Eso impide
        trampas y permite que el tiempo pase con el juego cerrado.
  - title:
      pt: Troféus derivados do que aconteceu
      en: Trophies derived from what happened
      es: Trofeos derivados de lo que pasó
    text:
      pt: >-
        Os 30 troféus não têm gatilhos espalhados pelo código: um serviço calcula métricas a partir dos
        atendimentos, descobertas e compras e avança os níveis, premiando cada conquista uma única vez.
      en: >-
        The 30 trophies have no triggers scattered through the code: a service computes metrics from jobs,
        discoveries and purchases and advances tiers, awarding each achievement only once.
      es: >-
        Los 30 trofeos no tienen disparadores repartidos por el código: un servicio calcula métricas a partir
        de los trabajos, descubrimientos y compras y avanza los niveles, premiando cada logro una sola vez.
  - title:
      pt: Especificação antes do código
      en: Specification before code
      es: Especificación antes del código
    text:
      pt: >-
        O projeto seguiu SDD e TDD: visão, escopo, decisões e modelo de domínio documentados, e o backend
        coberto por testes Pest antes de existir tela.
      en: >-
        The project followed SDD and TDD: vision, scope, decisions and domain model documented, and the
        backend covered by Pest tests before any screen existed.
      es: >-
        El proyecto siguió SDD y TDD: visión, alcance, decisiones y modelo de dominio documentados, y el
        backend cubierto por tests Pest antes de que existiera una pantalla.
