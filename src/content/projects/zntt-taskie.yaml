description:
  pt: >-
    Aplicativo desktop nativo para Windows, construído com Tauri e Vue 3. Integrado a uma API Django para
    sincronização entre o app desktop e mobile.
  en: >-
    Native Windows desktop application built with Tauri and Vue 3. Integrated with a Django API to keep the
    desktop and mobile apps in sync.
  es: >-
    Aplicación de escritorio nativa para Windows, construida con Tauri y Vue 3. Integrada con una API Django
    para sincronizar las apps de escritorio y móvil.
