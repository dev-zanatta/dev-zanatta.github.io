challenges:
  - title:
      pt: Agenda que entende serviço com intervalo
      en: A schedule that understands breaks
      es: Una agenda que entiende servicios con pausa
    text:
      pt: >-
        Um atendimento com pausa ocupa dois blocos com um vão livre no meio. A validação de conflito, a grade
        e a oferta de horários do link público precisam tratar esse vão como tempo disponível sem nunca
        sobrepor o início ou o fim do serviço.
      en: >-
        An appointment with a break takes two blocks with a free gap in between. Conflict validation, the grid
        and the public booking slots must treat that gap as available time without ever overlapping the start
        or the end of the service.
      es: >-
        Una cita con pausa ocupa dos bloques con un hueco libre en el medio. La validación de conflictos, la
        grilla y los horarios del enlace público deben tratar ese hueco como tiempo disponible sin superponer
        nunca el inicio o el fin del servicio.
  - title:
      pt: Horários livres de verdade no link público
      en: Truly free slots on the public link
      es: Horarios realmente libres en el enlace público
    text:
      pt: >-
        Os horários oferecidos descontam almoço, dias bloqueados, a duração de cada serviço e o que os outros
        profissionais já têm marcado. Com "qualquer profissional", o salão define quem atende na confirmação.
      en: >-
        Offered times account for lunch, blocked days, each service's duration and what other professionals
        already have booked. With "any professional", the salon decides who attends when confirming.
      es: >-
        Los horarios ofrecidos descuentan almuerzo, días bloqueados, la duración de cada servicio y lo que los
        demás profesionales ya tienen. Con "cualquier profesional", el salón define quién atiende al
        confirmar.
  - title:
      pt: Dados sensíveis criptografados e ainda pesquisáveis
      en: Encrypted yet searchable sensitive data
      es: Datos sensibles cifrados y aun así buscables
    text:
      pt: >-
        Telefone, CPF, endereço e observações ficam criptografados no banco. Para reconhecer quem volta pelo
        link público sem decifrar a base inteira, o cliente é localizado por um hash do telefone normalizado.
      en: >-
        Phone, tax ID, address and notes are encrypted in the database. To recognize returning clients on the
        public link without decrypting the whole base, they are looked up by a hash of the normalized phone
        number.
      es: >-
        Teléfono, documento, dirección y observaciones quedan cifrados en la base. Para reconocer a quien
        vuelve por el enlace público sin descifrar toda la base, el cliente se busca por un hash del teléfono
        normalizado.
  - title:
      pt: Isolamento por salão e por cargo
      en: Isolation by salon and by role
      es: Aislamiento por salón y por cargo
    text:
      pt: >-
        Todo dado é segregado por salão via escopo global. As rotas do profissional não recebem id na URL: o
        escopo vem do usuário autenticado, então é impossível por construção alcançar o dado de um colega.
      en: >-
        All data is scoped by salon through a global scope. Staff routes take no id in the URL: the scope
        comes from the authenticated user, so reaching a colleague's data is impossible by construction.
      es: >-
        Todo dato se segrega por salón con un scope global. Las rutas del profesional no reciben id en la URL:
        el alcance viene del usuario autenticado, así que es imposible por construcción llegar al dato de un
        colega.
  - title:
      pt: Rastro de tudo e nada perdido
      en: Every change traced, nothing lost
      es: Rastro de todo y nada perdido
    text:
      pt: >-
        Toda alteração é auditada com autor e data, e exclusões são reversíveis. Se um valor sumiu do caixa,
        dá para descobrir por onde ele passou; se um cliente foi apagado sem querer, ele volta.
      en: >-
        Every change is audited with author and date, and deletions can be reversed. If money vanished from
        the cash register you can find where it went; if a client was deleted by mistake, they come back.
      es: >-
        Todo cambio queda auditado con autor y fecha, y las eliminaciones son reversibles. Si un valor
        desapareció de la caja, se puede descubrir por dónde pasó; si un cliente se borró por error, vuelve.
