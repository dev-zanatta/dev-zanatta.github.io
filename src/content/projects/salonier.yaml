  - Vue 3
  - Quasar
  - Laravel
  - PostgreSQL
  - Capacitor
year: '2026'
status:
  pt: Em produção
  en: In production
  es: En producción
role:
  pt: Full stack — API, web e app
  en: Full stack — API, web and app
  es: Full stack — API, web y app
summary:
  - pt: >-
      Seu salão agendando enquanto você atende. O Salonier junta em um só lugar o link de agendamento online
      24 horas, a agenda por profissional, a ficha de cliente, o controle de caixa e o WhatsApp. Os clientes
      marcam sozinhos e o salão só confirma.
    en: >-
      Your salon booking appointments while you work. Salonier brings together a 24-hour online booking link,
      a per-professional schedule, client records, cash control and WhatsApp. Clients book on their own; the
      salon just confirms.
    es: >-
      Tu salón agendando mientras atiendes. Salonier reúne en un solo lugar el enlace de reservas online 24
      horas, la agenda por profesional, la ficha del cliente, el control de caja y WhatsApp. Los clientes
      reservan solos y el salón solo confirma.
  - pt: >-
      É um SaaS multi-tenant: cada salão fica isolado dos demais e cada pessoa entra com o próprio login, com
      acesso de administrador, recepção ou profissional. O mesmo front em Vue 3 e Quasar roda no navegador e
      vira app Android via Capacitor, publicado na Play Store. Atende salões, barbearias, estúdios de estética
      e nail designers, cada um com os próprios serviços, durações e preços.
    en: >-
      It is a multi-tenant SaaS: every salon is isolated from the others and every person signs in with their
      own login, as admin, front desk or professional. The same Vue 3 and Quasar front end runs in the browser
      and becomes an Android app through Capacitor, published on the Play Store. It serves hair salons,
      barbershops, aesthetics studios and nail designers, each with their own services, durations and prices.
    es: >-
      Es un SaaS multi-tenant: cada salón queda aislado de los demás y cada persona entra con su propio login,
      como administrador, recepción o profesional. El mismo front en Vue 3 y Quasar corre en el navegador y se
      convierte en app Android con Capacitor, publicada en la Play Store. Atiende salones, barberías,
      estéticas y manicuristas, cada uno con sus propios servicios, duraciones y precios.
problem:
  pt: >-
    Agenda no caderno com horário rasurado, meia hora por dia confirmando e remarcando no WhatsApp, cliente
    que manda mensagem às 23h e só recebe resposta no dia seguinte e, no fim do mês, ninguém sabe quanto
    sobrou nem qual serviço deu lucro. Não é culpa de quem toca o salão: é falta de sistema.
  en: >-
    A paper schedule with crossed-out times, half an hour a day confirming and rescheduling on WhatsApp,
    clients messaging at 11 p.m. and getting an answer only the next day, and at the end of the month nobody
    knows how much was left or which service made a profit. It is not the owner's fault: it is the lack of a
    system.
  es: >-
    Agenda en papel con horarios tachados, media hora al día confirmando y reprogramando por WhatsApp,
    clientes que escriben a las 23 h y reciben respuesta al día siguiente y, a fin de mes, nadie sabe cuánto
    sobró ni qué servicio dio ganancia. No es culpa de quien dirige el salón: es falta de sistema.
audience:
  pt: >-
    Salões de beleza, barbearias, estética e nail design: do dono que precisa enxergar os números à recepção
    que cuida do balcão e ao profissional que só quer ver a própria agenda.
  en: >-
    Hair salons, barbershops, aesthetics and nail design: from the owner who needs the numbers to the front
    desk and to the professional who only wants to see their own schedule.
  es: >-
    Salones de belleza, barberías, estética y uñas: desde el dueño que necesita ver los números hasta la
    recepción y el profesional que solo quiere ver su propia agenda.
features:
  - title:
      pt: Link de agendamento 24 horas
      en: 24-hour booking link
      es: Enlace de reservas 24 horas
    text:
      pt: >-
        Cada salão ganha um endereço próprio para a bio do Instagram, o status do WhatsApp e o Google. O
        cliente escolhe serviço, profissional (ou "qualquer um") e horário, sem app, cadastro ou senha, e
        recebe código de reserva e comprovante.
      en: >-
        Each salon gets its own address for the Instagram bio, WhatsApp status and Google. Clients pick the
        service, the professional (or "anyone") and the time, with no app, sign-up or password, and get a
        booking code and receipt.
      es: >-
        Cada salón tiene su propia dirección para la bio de Instagram, el estado de WhatsApp y Google. El
        cliente elige servicio, profesional (o "cualquiera") y horario, sin app, registro ni contraseña, y
        recibe código de reserva y comprobante.
  - title:
      pt: O dia inteiro em uma tela
      en: The whole day on one screen
      es: Todo el día en una pantalla
    text:
      pt: >-
        Quatro visões da mesma agenda: dia, por profissional, semana e lista. A linha do horário atual anda
        sozinha, o status muda com o relógio e a grade nunca deixa marcar em cima de outro atendimento.
      en: >-
        Four views of the same schedule: day, per professional, week and list. The current-time line moves by
        itself, statuses change with the clock and the grid never lets you book over another appointment.
      es: >-
        Cuatro vistas de la misma agenda: día, por profesional, semana y lista. La línea de la hora actual
        avanza sola, el estado cambia con el reloj y la grilla nunca deja reservar encima de otra cita.
  - title:
      pt: A pausa da química vira horário
      en: Chemical processing time becomes bookable
      es: La pausa del químico se vuelve horario
    text:
      pt: >-
        Coloração, luzes e progressiva têm tempo de espera no meio. O Salonier divide o atendimento em dois
        blocos e libera o intervalo na agenda para um encaixe, sem sair de cima do horário de ninguém.
      en: >-
        Coloring, highlights and keratin treatments have waiting time in the middle. Salonier splits the
        appointment into two blocks and frees the gap for a quick fit-in, without overlapping anyone.
      es: >-
        Coloración, mechas y alisado tienen tiempo de espera en el medio. Salonier divide la cita en dos
        bloques y libera el intervalo para un turno extra, sin pisar a nadie.
  - title:
      pt: Clientes que não somem
      en: Clients who don't disappear
      es: Clientes que no desaparecen
    text:
      pt: >-
        A ficha mostra quanto a pessoa já gastou, o ticket médio e de quantas em quantas semanas ela volta.
        Quem passou do prazo aparece na lista, com selo VIP automático e aniversariantes da semana no painel.
      en: >-
        Each record shows how much the person has spent, the average ticket and how often they come back.
        Overdue clients show up on the list, with an automatic VIP badge and this week's birthdays on the
        dashboard.
      es: >-
        Cada ficha muestra cuánto gastó la persona, el ticket promedio y cada cuántas semanas vuelve. Quien
        pasó del plazo aparece en la lista, con sello VIP automático y cumpleaños de la semana en el panel.
  - title:
      pt: Caixa fechado no dia
      en: Cash closed every day
      es: Caja cerrada en el día
    text:
      pt: >-
        Entradas, saídas, sangria e formas de pagamento configuradas pelo salão. Cada atendimento pago cai no
        caixa com cliente e serviço, sai recibo para imprimir e todo cancelamento deixa rastro.
      en: >-
        Income, expenses, cash withdrawals and payment methods set by the salon. Every paid appointment lands
        in the cash register with client and service, prints a receipt and every cancellation leaves a trail.
      es: >-
        Entradas, salidas, retiros y formas de pago definidas por el salón. Cada cita pagada entra en caja con
        cliente y servicio, sale recibo para imprimir y toda cancelación deja rastro.
  - title:
      pt: Qual serviço paga a conta
      en: Which service pays the bills
      es: Qué servicio paga las cuentas
    text:
      pt: >-
        Relatórios de entradas, saídas, saldo e ticket médio em qualquer período, com fluxo diário, top 10
        serviços por faturamento e a divisão entre PIX, cartão e dinheiro.
      en: >-
        Reports of income, expenses, balance and average ticket for any period, with daily flow, top 10
        services by revenue and the split between PIX, card and cash.
      es: >-
        Informes de entradas, salidas, saldo y ticket promedio en cualquier período, con flujo diario, top 10
        servicios por facturación y la división entre PIX, tarjeta y efectivo.
  - title:
      pt: WhatsApp em um clique
      en: WhatsApp in one click
      es: WhatsApp en un clic
    text:
      pt: >-
        Modelos de confirmação, lembrete, retorno e aniversário escritos uma vez com etiquetas (cliente,
        serviço, data, valor). Na hora de enviar, o sistema preenche os dados reais e abre o WhatsApp.
      en: >-
        Confirmation, reminder, come-back and birthday templates written once with tags (client, service,
        date, price). When sending, the system fills in the real data and opens WhatsApp.
      es: >-
        Plantillas de confirmación, recordatorio, regreso y cumpleaños escritas una vez con etiquetas
        (cliente, servicio, fecha, valor). Al enviar, el sistema completa los datos reales y abre WhatsApp.
  - title:
      pt: Faturamento só para quem deve ver
      en: Revenue only for those who should see it
      es: Facturación solo para quien debe verla
    text:
      pt: >-
        Administrador vê tudo; recepção vê agenda, clientes e caixa do dia; profissional vê só os próprios
        atendimentos. Para quem atende, o caixa simplesmente não existe.
      en: >-
        Admins see everything; the front desk sees schedule, clients and the day's cash; professionals see
        only their own appointments. For staff, the cash register simply doesn't exist.
      es: >-
        El administrador ve todo; recepción ve agenda, clientes y la caja del día; el profesional ve solo sus
        propias citas. Para quien atiende, la caja simplemente no existe.
