tagline:
  pt: SaaS completo para gestão de salões de beleza
  en: Complete SaaS for beauty salon management
  es: SaaS completo para la gestión de salones de belleza
description:
  pt: >-
    Plataforma SaaS com agendamento online, controle financeiro, gestão de clientes e profissionais.
    Disponível como aplicativo web desktop e app mobile para clientes e colaboradores.
  en: >-
    SaaS platform with online booking, financial control, client and staff management. Available as a desktop
    web application and as a mobile app for clients and staff.
  es: >-
    Plataforma SaaS con reservas online, control financiero, gestión de clientes y profesionales. Disponible
    como aplicación web de escritorio y app móvil para clientes y colaboradores.
