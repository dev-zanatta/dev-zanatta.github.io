challenges:
  - title:
      pt: Offline-first com lançamento retroativo
      en: Offline-first with backdated entries
      es: Offline-first con registros retroactivos
    text:
      pt: >-
        Cada registro nasce no aparelho com um GUID v7 e entra numa fila de sincronização. Como dá para lançar
        um abastecimento de ontem depois do de hoje, a API valida a cronologia do hodômetro em relação aos
        registros vizinhos.
      en: >-
        Every record is born on the device with a GUID v7 and enters a sync queue. Since yesterday's fill-up
        can be logged after today's, the API validates odometer chronology against neighboring records.
      es: >-
        Cada registro nace en el dispositivo con un GUID v7 y entra en una cola de sincronización. Como se
        puede cargar la carga de ayer después de la de hoy, la API valida la cronología del odómetro respecto
        de los registros vecinos.
  - title:
      pt: Isolamento por frota em tudo
      en: Fleet isolation everywhere
      es: Aislamiento por flota en todo
    text:
      pt: >-
        Toda tabela carrega a frota, filtros globais do EF Core restringem cada consulta e uma guarda no
        SaveChanges impede gravar fora do escopo. As rotas são fechadas por padrão.
      en: >-
        Every table carries the fleet, EF Core global filters restrict every query and a SaveChanges guard
        prevents writing outside the scope. Routes are closed by default.
      es: >-
        Toda tabla lleva la flota, filtros globales de EF Core restringen cada consulta y una guarda en
        SaveChanges impide grabar fuera del alcance. Las rutas están cerradas por defecto.
  - title:
      pt: Upload que funciona de verdade no Expo
      en: Uploads that actually work in Expo
      es: Uploads que funcionan de verdad en Expo
    text:
      pt: >-
        O fetch do Expo recusava arquivos no FormData e nenhum anexo chegava ao servidor. O upload passou para
        XMLHttpRequest, com o nome do arquivo decodificado na API e envio só em Wi-Fi quando o usuário
        prefere.
      en: >-
        Expo's fetch rejected files in FormData and no attachment reached the server. Uploads moved to
        XMLHttpRequest, with the file name decoded in the API and Wi-Fi-only uploads when the user prefers.
      es: >-
        El fetch de Expo rechazaba archivos en el FormData y ningún adjunto llegaba al servidor. El upload
        pasó a XMLHttpRequest, con el nombre del archivo decodificado en la API y envío solo con Wi-Fi cuando
        el usuario lo prefiere.
  - title:
      pt: Custo que não conta duas vezes
      en: Costs that don't count twice
      es: Costos que no cuentan dos veces
    text:
      pt: >-
        Documento e despesa não podem registrar o mesmo pagamento, senão o custo por quilômetro dobra. A
        modelagem separa o que é prazo (documento) do que é dinheiro (despesa).
      en: >-
        A document and an expense can't record the same payment, or cost per kilometer doubles. The model
        separates what is a deadline (document) from what is money (expense).
      es: >-
        Documento y gasto no pueden registrar el mismo pago, o el costo por kilómetro se duplica. El modelo
        separa lo que es plazo (documento) de lo que es dinero (gasto).
