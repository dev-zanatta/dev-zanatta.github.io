type:
  pt: Mobile · API
  en: Mobile · API
  es: Móvil · API
tagline:
  pt: Manutenção de veículos para a casa ou a frota
  en: Vehicle maintenance for a household or a small fleet
  es: Mantenimiento de vehículos para la casa o la flota
description:
  pt: >-
    Centraliza manutenções, abastecimentos, documentos e custos por veículo. Pensado para o registro acontecer
    no posto ou na oficina: funciona offline, aceita lançamento retroativo e sincroniza quando a conexão
    volta.
  en: >-
    Centralizes maintenance, refueling, documents and costs per vehicle. Designed for records made at the gas
    station or the garage: works offline, accepts backdated entries and syncs once the connection returns.
  es: >-
    Centraliza mantenimientos, repostajes, documentos y costos por vehículo. Pensado para registrar en la
    estación o el taller: funciona sin conexión, acepta registros retroactivos y sincroniza al volver la
    señal.
