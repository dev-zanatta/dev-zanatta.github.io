  - C#
  - .NET 10
  - Expo
  - React Native
  - PostgreSQL
  - Docker
year: '2026'
status:
  pt: Teste fechado na Play Store
  en: Closed testing on the Play Store
  es: Prueba cerrada en la Play Store
role:
  pt: Full stack — API, app e web
  en: Full stack — API, app and web
  es: Full stack — API, app y web
summary:
  - pt: >-
      O Garajá reúne tudo o que um carro custa: abastecimentos, manutenções, despesas, documentos e
      quilometragem, por veículo, para uma casa ou uma frota pequena. O painel responde duas perguntas logo de
      cara — o que vence em breve e quanto cada veículo custa por quilômetro.
    en: >-
      Garajá brings together everything a car costs: refueling, maintenance, expenses, documents and mileage,
      per vehicle, for a household or a small fleet. The dashboard answers two questions right away — what is
      due soon and how much each vehicle costs per kilometer.
    es: >-
      Garajá reúne todo lo que cuesta un auto: cargas de combustible, mantenimientos, gastos, documentos y
      kilometraje, por vehículo, para una casa o una flota chica. El panel responde dos preguntas de entrada:
      qué vence pronto y cuánto cuesta cada vehículo por kilómetro.
  - pt: >-
      O registro acontece no posto ou na oficina, muitas vezes sem sinal, então o app é offline-first: grava
      no aparelho, aceita lançamento retroativo e sincroniza quando a conexão volta. A API em .NET 10 é o
      contrato comum do app em React Native e do painel web em React, com anexos guardados no Cloudflare R2.
    en: >-
      Entries happen at the gas station or the shop, often with no signal, so the app is offline-first: it
      stores on the device, accepts backdated entries and syncs when the connection returns. The .NET 10 API
      is the shared contract for the React Native app and the React web panel, with attachments stored on
      Cloudflare R2.
    es: >-
      El registro se hace en la estación de servicio o en el taller, muchas veces sin señal, así que la app es
      offline-first: guarda en el dispositivo, acepta registros retroactivos y sincroniza cuando vuelve la
      conexión. La API en .NET 10 es el contrato común de la app en React Native y del panel web en React, con
      adjuntos guardados en Cloudflare R2.
problem:
  pt: >-
    Nota de abastecimento na carteira, revisão anotada no manual, seguro e IPVA lembrados em cima da hora. Sem
    histórico, ninguém sabe o consumo real do carro, quando foi a última troca de óleo ou quanto o veículo
    custou no ano.
  en: >-
    Fuel receipts in the wallet, services noted in the owner's manual, insurance and vehicle tax remembered at
    the last minute. With no history, nobody knows the car's real fuel economy, when the last oil change was
    or how much the vehicle cost in the year.
  es: >-
    Tickets de combustible en la billetera, servicios anotados en el manual, seguro e impuestos recordados a
    último momento. Sin historial, nadie sabe el consumo real del auto, cuándo fue el último cambio de aceite
    o cuánto costó el vehículo en el año.
audience:
  pt: Famílias com mais de um veículo e pequenas empresas com uma frota enxuta, com papéis de dono e membro.
  en: Families with more than one vehicle and small companies with a lean fleet, with owner and member roles.
  es: Familias con más de un vehículo y pequeñas empresas con una flota reducida, con roles de dueño y miembro.
features:
  - title:
      pt: Painel do que vence e do que custa
      en: A dashboard of what's due and what it costs
      es: Panel de lo que vence y de lo que cuesta
    text:
      pt: >-
        Gasto dos últimos 12 meses, custo por quilômetro, quilômetros rodados, alertas de manutenção e
        documentos e gasto por mês e por veículo.
      en: >-
        Last 12 months spending, cost per kilometer, kilometers driven, maintenance and document alerts, and
        spending per month and per vehicle.
      es: >-
        Gasto de los últimos 12 meses, costo por kilómetro, kilómetros recorridos, alertas de mantenimiento y
        documentos y gasto por mes y por vehículo.
  - title:
      pt: Abastecimentos e consumo
      en: Refueling and fuel economy
      es: Cargas y consumo
    text:
      pt: >-
        Litros, preço, combustível, posto e tanque cheio. O consumo em km/l é calculado entre abastecimentos e
        o custo por km sai de tudo que o veículo gastou.
      en: >-
        Liters, price, fuel, station and full tank. Fuel economy in km/l is computed between fill-ups and cost
        per km comes from everything the vehicle cost.
      es: >-
        Litros, precio, combustible, estación y tanque lleno. El consumo en km/l se calcula entre cargas y el
        costo por km sale de todo lo que gastó el vehículo.
  - title:
      pt: Plano de manutenção
      en: Maintenance plan
      es: Plan de mantenimiento
    text:
      pt: >-
        Regras por quilometragem e por tempo (óleo, filtros, alinhamento, correia, bateria) com última e
        próxima execução e aviso antes de vencer.
      en: >-
        Rules by mileage and by time (oil, filters, alignment, timing belt, battery) with last and next
        service and a warning before it's due.
      es: >-
        Reglas por kilometraje y por tiempo (aceite, filtros, alineación, correa, batería) con última y
        próxima ejecución y aviso antes del vencimiento.
  - title:
      pt: Manutenções, despesas e documentos
      en: Maintenance, expenses and documents
      es: Mantenimientos, gastos y documentos
    text:
      pt: >-
        Peças e mão de obra por oficina, pedágio, lavagem, IPVA, licenciamento, multas, CRLV e seguro com
        alerta de vencimento.
      en: >-
        Parts and labor per shop, tolls, car washes, vehicle tax, licensing, fines, registration and insurance
        with expiry alerts.
      es: >-
        Repuestos y mano de obra por taller, peajes, lavados, impuestos, patente, multas, documentación y
        seguro con alerta de vencimiento.
  - title:
      pt: Anexos e anotações
      en: Attachments and notes
      es: Adjuntos y notas
    text:
      pt: Fotos e PDFs organizados em pastas, visualizador em tela cheia no app e anotações fixadas por veículo.
      en: Photos and PDFs organized in folders, a full-screen viewer in the app and pinned notes per vehicle.
      es: Fotos y PDF organizados en carpetas, visor a pantalla completa en la app y notas fijadas por vehículo.
  - title:
      pt: Frota compartilhada
      en: Shared fleet
      es: Flota compartida
    text:
      pt: Convite para outros membros, papéis de dono e membro, e o mesmo histórico para toda a casa ou empresa.
      en: Invite other members, owner and member roles, and the same history for the whole household or company.
      es: >-
        Invitación a otros miembros, roles de dueño y miembro, y el mismo historial para toda la casa o
        empresa.
