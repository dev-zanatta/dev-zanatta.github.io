challenges:
  - title:
      pt: Projetar em vez de materializar
      en: Project instead of materialize
      es: Proyectar en lugar de materializar
    text:
      pt: >-
        Contas recorrentes não geram um lançamento por mês no banco. Cada mês é calculado a partir da série
        vigente, e só o valor real informado vira registro. Isso mantém a projeção de 12 meses barata e sempre
        coerente com a configuração atual.
      en: >-
        Recurring bills don't create one row per month in the database. Each month is computed from the
        current series, and only the real value informed becomes a record. That keeps the 12-month projection
        cheap and always consistent with the current setup.
      es: >-
        Las cuentas recurrentes no generan un registro por mes en la base. Cada mes se calcula a partir de la
        serie vigente y solo el valor real informado se guarda. Eso mantiene la proyección de 12 meses liviana
        y siempre coherente con la configuración actual.
  - title:
      pt: Mudar o valor sem reescrever o passado
      en: Change the amount without rewriting the past
      es: Cambiar el valor sin reescribir el pasado
    text:
      pt: >-
        Uma conta é versionada por vigência: alterar o aluguel a partir de agora fecha a versão anterior no
        mês corrente e abre uma nova, preservando os meses já fechados.
      en: >-
        A bill is versioned by validity period: changing the rent from now on closes the previous version in
        the current month and opens a new one, preserving the months already closed.
      es: >-
        Una cuenta se versiona por vigencia: cambiar el alquiler a partir de ahora cierra la versión anterior
        en el mes actual y abre una nueva, preservando los meses ya cerrados.
  - title:
      pt: Pontuação justa por período
      en: Fair points per period
      es: Puntos justos por período
    text:
      pt: >-
        Cada conclusão é registrada por período (dia, semana ou mês) e só pode acontecer uma vez nele. Os
        pontos dependem da frequência da tarefa e o ranking é agregado por mês ou no histórico total.
      en: >-
        Each completion is stored per period (day, week or month) and can happen only once in it. Points
        depend on the chore's frequency and the ranking is aggregated per month or all-time.
      es: >-
        Cada conclusión se registra por período (día, semana o mes) y solo puede ocurrir una vez en él. Los
        puntos dependen de la frecuencia de la tarea y el ranking se agrega por mes o en el historial total.
  - title:
      pt: Simplificar um módulo em produção
      en: Simplifying a module in production
      es: Simplificar un módulo en producción
    text:
      pt: >-
        O financeiro foi reestruturado com o app em uso: saíram contas bancárias, subcategorias e divisão por
        gasto, com migrations defensivas e uma ordem de passos que não quebrasse os dados existentes.
      en: >-
        The finance module was restructured with the app in use: bank accounts, subcategories and per-expense
        splits were removed through defensive migrations and an order of steps that wouldn't break existing
        data.
      es: >-
        Las finanzas se reestructuraron con la app en uso: salieron cuentas bancarias, subcategorías y
        división por gasto, con migraciones defensivas y un orden de pasos que no rompiera los datos
        existentes.
